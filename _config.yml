# Site settings
title         : "Themistoklis Nikas" # used in browser tabs and search results
title_left    : "Themistoklis"
title_right   : "Nikas" # default: ""
description   : "Themistoklis Nikas is a Computer Science PhD student at Boston University working on mechanistic interpretability of large language models."
keywords      : "Themistoklis Nikas, Themis Nikas, Boston University, computer science, PhD, mechanistic interpretability, large language models, LLMs, uncertainty, calibration"
url           : "https://tnikas.github.io" # site url
baseurl       : "" # apply repo name like "/myproject" if used under gh-pages branch, else (under master branch) just leave empty/blank
cover         : "/assets/images/author.jpg" # image shown in link previews (og:image)

# Google Search Console > Add property > URL prefix > "HTML tag" method:
# uncomment and paste only the value of content="..." from the tag it gives you.
# google_site_verification: ""

twitter_username  : ""
comments_enabled  : false # if enabled (set to true), please provide your disqus_username
disqus_shortname  : ""
postshare_enabled : false

# Build settings
permalink   : /:year/:title/
markdown    : kramdown
highlighter : rouge

source      : ./
destination : ./_site

# Sass configuration
sass:
  sass_dir  : assets/scss
  style     : compressed # expanded

# Author settings
author:
  name           : "Themistoklis Nikas"
  alternate_name : "Themis Nikas"
  job_title      : "PhD Student in Computer Science"
  affiliation    : "Boston University"
  alumni_of      : "University of Ioannina"
  # Shown under the intro on the homepage. The http(s) links are also given to
  # search engines as your other profiles (schema.org "sameAs").
  links:
    - title: "tnikas@bu.edu"
      url: "mailto:tnikas@bu.edu"
    - title: "Google Scholar"
      url: "https://scholar.google.com/citations?user=dBImAjsAAAAJ&hl=en"
    - title: "GitHub"
      url: "https://github.com/tnikas"
    - title: "LinkedIn"
      url: "https://www.linkedin.com/in/tnikas/"

plugins:
  - jekyll-sitemap

# navbar pages
navbar:
  - slug: publications
    title: Publications
  - title: CV
    url: /Themistoklis_Nikas_CV.pdf

exclude:
  - "gulp"
  - "node_modules"
  - "bower"
  - "bower_components"
  - "config.rb"
  - "src"
  - "Gemfile"
  - "Gemfile.lock"
  - ".rvmrc"
  - ".rbenv-version"
  - "package.json"
  - "gulpfile.js"
  - "README.md"
  - "Rakefile"
  - "changelog.md"
  - "script"
  - "vendor"
  - "thinkspace.gemspec"
  - "cv"

defaults:
  # Google Search Console ownership file: must stay published, but isn't a page
  - scope:
      path: "google60649950c3607a34.html"
    values:
      sitemap: false
